# Security headers, included by the production template (docker/nginx.conf.template, in every location: add_header in a
# location replaces the ones inherited from the server block) and by the host nginx (dev/nginx/nginx.conf, via bin/start.sh).
# `always` adds them to error responses too.
#
# Content-Security-Policy, in terms of what the app does:
#   script-src   our bundle plus the one inline script in web/index.html (the early metadata request), pinned by hash.
#                Change that script and the hash changes: web/test/securityHeaders.test.ts fails until this file is updated.
#   connect-src  the station CDN (metadata, HLS manifest and segments via hls.js) and our own /api.
#   media-src    blob: (hls.js feeds the <audio> element through MediaSource), data: (it adds a dummy WebVTT text track as
#                data:,WEBVTT); the CDN for Safari's native HLS.
#   img-src      the cover on the CDN (also used for the media-session artwork).
#   worker-src   blob: (hls.js transmuxes in a worker created from a blob).
# Keep the CDN host equal to CDN_BASE in web/src/config.ts (the same test checks).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-netIH2R96BNhBjUiEAaDd53SMlyllytVcdDD5z7O/+Q='; style-src 'self'; img-src 'self' data: https://d3d4yli4hf5bmh.cloudfront.net; media-src 'self' blob: data: https://d3d4yli4hf5bmh.cloudfront.net; connect-src 'self' https://d3d4yli4hf5bmh.cloudfront.net; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

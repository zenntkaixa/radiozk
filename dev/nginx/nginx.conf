# Template: bin/start.sh fills in MIMETYPES, WWWROOT, SECURITYHEADERS, NGINX_PORT and APP_PORT (from bin/env.sh).
# Other paths are relative to the prefix passed via `nginx -p dev/nginx`.
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;
events { worker_connections 256; }
http {
    include MIMETYPES;
    access_log logs/access.log;
    client_body_temp_path tmp/body;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fastcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;
    sendfile on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 127.0.0.1:NGINX_PORT;
        server_name localhost;
        root WWWROOT;
        index index.html;
        include SECURITYHEADERS;  # no location below sets add_header, so these apply everywhere
        location = /favicon.ico { access_log off; return 204; }  # no .ico shipped; don't serve index.html as an icon
        location / { try_files $uri $uri/ /index.html; }  # SPA fallback for client-side routes
        # Node app (app/)
        location /api/ { proxy_pass http://127.0.0.1:APP_PORT; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }  # the API rate-limits per address: overwrite, don't append
    }
}

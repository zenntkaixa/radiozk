# Paths are relative to the prefix passed via `nginx -p dev/nginx`; root is set absolute by bin/start.sh
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;
events { worker_connections 256; }
http {
    include MIMETYPES;
    access_log logs/access.log;
    client_body_temp_path tmp/body;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fastcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;
    sendfile on;
    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        root WWWROOT;
        index index.html;
        location / { try_files $uri $uri/ /index.html; }  # SPA fallback for client-side routes
        # Node app (app/) on :3000
        location /api/ { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; }
    }
}

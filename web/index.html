<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>radiozk</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Start the CDN connection (DNS + TLS) now instead of when the first request is made after the JS has loaded.
         Same host as CDN_BASE in src/config.ts (test/indexHtml.test.ts keeps them in step). Both variants are needed:
         fetch/XHR (metadata, HLS) and <img> (cover) use separate connection pools. -->
    <link rel="preconnect" href="https://d3d4yli4hf5bmh.cloudfront.net" crossorigin />
    <link rel="preconnect" href="https://d3d4yli4hf5bmh.cloudfront.net" />
    <!-- Start the metadata request now instead of after the JS has loaded and the page has rendered (the cover can only
         start once it answers). useNowPlaying() takes this promise over once, on its first poll. URL and fetch options
         must match METADATA_URL / the poll in src/nowPlaying.ts (test/indexHtml.test.ts checks the URL). -->
    <script>
      window.__earlyMetadata = fetch('https://d3d4yli4hf5bmh.cloudfront.net/metadatav2.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

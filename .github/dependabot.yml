version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    target-branch: develop
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly }

name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: radiozk
          POSTGRES_PASSWORD: radiozk
          POSTGRES_DB: radiozk
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U radiozk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The API tests create and use their own radiozk_test database on this server.
      ADMIN_DATABASE_URL: postgresql://radiozk:radiozk@127.0.0.1:5432/radiozk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: web
      - name: Type check and build
        run: npm run build
        working-directory: web
      - name: Backend unit and API tests
        run: npm test
        working-directory: app
      - name: Frontend parser and UI tests
        run: npm test
        working-directory: web

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test the production images
        run: bin/docker-smoke.sh

name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'   # weekly: new advisories appear even when the code doesn't change

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm audit (fails on high and above)
        run: bin/audit.sh

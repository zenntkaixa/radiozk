# Render Blueprint. GENERATED by web/scripts/render-config.mjs from docker/security-headers.conf:
# edit the script, run `cd web && npm run render:config`, commit both. See "Render" in README.md.
#
# The names below are also the onrender.com subdomains. If one is already taken Render appends a suffix, and then
# the /api rewrite destination (and this file) must be updated to the real API URL.
# The database and the API must share a region (it cannot be changed later). Both use the free plan here; a free
# database expires after 30 days and a free web service sleeps when idle (see README.md).

databases:
  - name: zenntkaixa-radiozk-db
    plan: free
    region: oregon
    databaseName: radiozk
    user: radiozk
    postgresMajorVersion: "18"

services:
  # The API: the Express app from app/, listening on Render's PORT.
  - type: web
    name: zenntkaixa-radiozk-api
    runtime: node
    plan: free
    region: oregon
    rootDir: app
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zenntkaixa-radiozk-db
          property: connectionString
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_VERSION
        value: 24.22.1

  # The front end: static files on Render's CDN, with /api proxied to the API service.
  - type: web
    name: zenntkaixa-radiozk
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: ./www
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
    headers:
      - path: "/*"
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-netIH2R96BNhBjUiEAaDd53SMlyllytVcdDD5z7O/+Q='; style-src 'self'; img-src 'self' data: https://d3d4yli4hf5bmh.cloudfront.net; media-src 'self' blob: data: https://d3d4yli4hf5bmh.cloudfront.net; connect-src 'self' https://d3d4yli4hf5bmh.cloudfront.net; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: "/*"
        name: X-Content-Type-Options
        value: "nosniff"
      - path: "/*"
        name: X-Frame-Options
        value: "DENY"
      - path: "/*"
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: "/*"
        name: Permissions-Policy
        value: "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
      - path: "/*"
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
      - path: "/assets/*"
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
    routes:
      - type: rewrite
        source: "/api/*"
        destination: "https://zenntkaixa-radiozk-api.onrender.com/api/*"
      - type: rewrite
        source: "/favicon.ico"
        destination: "/favicon.svg"
      - type: rewrite
        source: "/*"
        destination: "/index.html"

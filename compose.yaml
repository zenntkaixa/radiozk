# Production release: PostgreSQL + API + nginx (static front end, /api proxy).
#   cp .env.example .env   # set POSTGRES_PASSWORD
#   docker compose up -d --build
# Only the web service is published; the API and database stay on the internal network.
name: radiozk

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: radiozk
      POSTGRES_DB: radiozk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiozk -d radiozk"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: ., target: api }
    image: radiozk-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://radiozk:${POSTGRES_PASSWORD}@db:5432/radiozk
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  web:
    build: { context: ., target: web }
    image: radiozk-web:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      api: { condition: service_healthy }
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  pgdata:
